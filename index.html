const STORE_KEY = 'looking_for_the_room_key';

function b64ToBytes(b64) { return Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)); }
function bytesToB64(bytes) { return btoa(String.fromCharCode(...bytes)); }

async function deriveKey(password) {
  const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name: 'PBKDF2', hash: 'SHA-256', salt: b64ToBytes(ENC.salt), iterations: ENC.iterations }, material, 256);
  return new Uint8Array(bits);
}

async function decryptWith(keyBytes) {
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(ENC.iv) }, key, b64ToBytes(ENC.ciphertext));
  return new TextDecoder().decode(plain);
}

// 読み込みの途中で書き込むと、パスワード画面と中身が重なる。読み込みが終わってから丸ごと差し替える。
function show(html) {
  const replaceDocument = () => { document.open(); document.write(html); document.close(); };
  if (document.readyState === 'complete') replaceDocument();
  else window.addEventListener('load', replaceDocument, { once: true });
}

function loadSavedKey() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    return saved && saved.salt === ENC.salt ? b64ToBytes(saved.key) : null;
  } catch (error) {
    return null;
  }
}

function saveKey(keyBytes) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify({ salt: ENC.salt, key: bytesToB64(keyBytes) }));
  } catch (error) {
    console.warn('この端末に保存できませんでした', error);
  }
}

// 保存済みの鍵があれば自動で開く（パスワードを変えたら使えなくなるので、入力し直し）。
(async () => {
  const savedKey = loadSavedKey();
  if (!savedKey) return;
  try {
    show(await decryptWith(savedKey));
  } catch (error) {
    try { localStorage.removeItem(STORE_KEY); } catch (ignored) { /* 保存できない端末 */ }
  }
})();

document.getElementById('form').addEventListener('submit', async (event) => {
  event.preventDefault();
  const button = document.getElementById('btn');
  const errorLine = document.getElementById('error');
  button.disabled = true; button.textContent = '確認中…'; errorLine.style.display = 'none';
  try {
    const keyBytes = await deriveKey(document.getElementById('pw').value);
    const html = await decryptWith(keyBytes);
    if (document.getElementById('remember').checked) saveKey(keyBytes);
    show(html);
  } catch (error) {
    errorLine.style.display = 'block';
    button.disabled = false; button.textContent = '開く';
  }
});
</script>
